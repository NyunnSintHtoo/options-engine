[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-engine"
version = "0.1.0"
description = "Professional options pricing engine for US equity and index options with correctness and numerical stability as first-class concerns."
readme = "docs/README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Options Engine Contributors", email = "dev@options-engine.dev"},
]
keywords = ["options", "derivatives", "finance", "quantitative", "pricing", "black-scholes"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.9.0",
    "pandas>=1.3.0",
    "streamlit>=1.20.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=0.990",
    "ipython>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

perf = [
    "numba>=0.56.0",
    "py-spy>=0.3.14",
]

[project.urls]
Repository = "https://github.com/yourusername/options-engine"
Documentation = "https://github.com/yourusername/options-engine"
Issues = "https://github.com/yourusername/options-engine/issues"

[tool.setuptools]
packages = ["options_engine"]

[tool.setuptools.package-dir]
options_engine = "python/src/options_engine"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
